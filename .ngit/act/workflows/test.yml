# Nostr CI (ngit-ci) mirror of .github/workflows/test.yml
# ngit-ci refuses job-level `uses:` and only shares artifacts between jobs when the
# operator enables Blossom uploads, so each job builds the packages it tests.

name: Test Pipeline

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test-node:
    name: Test on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
      fail-fast: false

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build packages
        run: pnpm turbo build --filter='./packages/*'

      - name: Run tests
        run: pnpm exec vitest run

  test-react:
    name: Test applesauce-react on React ${{ matrix.react-major }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        react-major: [18, 19]
      fail-fast: false

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # Build against the locked React before swapping versions, matching the GitHub pipeline
      - name: Build packages
        run: pnpm turbo build --filter='./packages/*'

      - name: Select React ${{ matrix.react-major }}
        run: pnpm --filter applesauce-react add --save-dev "react@^${{ matrix.react-major }}.0.0" "react-dom@^${{ matrix.react-major }}.0.0" "@types/react@^${{ matrix.react-major }}.0.0" "@types/react-dom@^${{ matrix.react-major }}.0.0"

      - name: Run applesauce-react tests
        run: pnpm --filter applesauce-react test

  test-bun:
    name: Test on Bun ${{ matrix.bun-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        bun-version: [latest, "1.1"]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun ${{ matrix.bun-version }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build packages
        run: pnpm turbo build --filter='./packages/*'

      - name: Run tests with Bun
        run: bun run vitest run
