packages:
  - packages/*
  - apps/*
linkWorkspacePackages: true
minimumReleaseAgeExclude:
  - "@kehto/firewall@0.9.0"
  - "@kehto/runtime@0.30.0"
  - "@kehto/services@0.32.1"
  - "@kehto/shell@0.34.0"
allowBuilds:
  "@swc/core": true
  better-sqlite3: true
  esbuild: true
overrides:
  # Keep the Turso WASM runtime on the emnapi version its wasm binary was built with
  "@napi-rs/wasm-runtime@1.0.7>@emnapi/core": 1.8.1
  "@napi-rs/wasm-runtime@1.0.7>@emnapi/runtime": 1.8.1
